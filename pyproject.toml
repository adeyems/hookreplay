[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hookreplay"
version = "0.1.0"
description = "HookReplay: local synthetic developer workflow tooling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
hookreplay = "hookreplay:entrypoint"

[tool.setuptools]
py-modules = ["hookreplay"]
